    const canLink=/^https?:$/.test(location.protocol) && !['localhost','127.0.0.1','::1'].includes(location.hostname);
    const link=canLink ? location.origin+location.pathname+'#task='+encodeURIComponent(JSON.stringify({date:today(),ids:[...newList,...reviewList].map(w=>w.id),batches:state.batches})) : '';
    info('今天学什么，一次说清楚',`<p>复制这段话发给孩子，后续每天都在同一本合集学习。</p><textarea class="notice-text" id="noticeText" rows="10" readonly>${esc(text+(link?'\n\n今日入口：'+link:''))}</textarea><div class="share-actions"><button class="primary" id="copyNotice">复制学习通知</button>${!link?'<button class="secondary" id="noticeDownload">下载合集给孩子</button>':''}</div><p class="subtle">${canLink?'老师的指定任务会在同一入口上方显示；学生的进度保存在自己的浏览器。':'当前是本地版本。更换合集文件前先备份进度，换文件后在“复习计划”恢复。固定在线入口需要另行发布。'}</p>`);
    $('copyNotice').onclick=async()=>{const field=$('noticeText');try{await navigator.clipboard.writeText(field.value);toast('学习通知已复制。');}catch{field.select();toast('请复制已选中的学习通知。');}};
    if($('noticeDownload'))$('noticeDownload').onclick=downloadGarden;
  }
  document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;render();});
  document.querySelector('.brand').onclick=e=>{e.preventDefault();view='today';render();};
  document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>$(el.dataset.close).close());
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
  $('practiceDialog').addEventListener('close',()=>{stopAudio();render();});
  $('settingsButton').onclick=settings;$('backupButton').onclick=backup;$('downloadGarden').onclick=downloadGarden;
  $('settingsForm').onsubmit=e=>{e.preventDefault();const newLimit=Number($('newLimit').value),reviewLimit=Number($('reviewLimit').value);if(!Number.isInteger(newLimit)||newLimit<1||newLimit>100||!Number.isInteger(reviewLimit)||reviewLimit<0||reviewLimit>200){toast('请填写有效的整数数量。');return;}state.settings={newLimit,reviewLimit,rate:Number($('speechRate').value),accent:$('speechAccent').value};persist();$('settingsDialog').close();render();toast('学习节奏已更新。');};
  $('batchForm').onsubmit=e=>{e.preventDefault();try{const date=$('batchDate').value;C.addDays(date,0);const lines=$('batchText').value.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)throw Error('先添几个词吧。');const data=lines.map(line=>{const parts=line.split(/[|｜\t]/);if(parts.length<2)throw Error('每行请按“英文 | 中文”填写。');return{en:parts[0].trim(),zh:parts.slice(1).join('；').trim()};});const batch=cleanBatches([{id:`custom-${Date.now()}`,date,title:$('batchTitle').value.trim(),words:data}])[0];const seen=new Set(words().map(w=>w.en));batch.words=batch.words.filter(w=>{if(seen.has(w.en))return false;seen.add(w.en);return true;});if(!batch.words.length)throw Error('这些词已经在合集里啦，无需重复添加。');state.batches.push(batch);persist();$('managerDialog').close();view='library';render();toast(`加入了${batch.words.length}个新词，以后都在这个合集。`);}catch(err){toast(err.message);}};
  $('restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>15*1024*1024)throw Error('备份文件过大');const restored=validateState(JSON.parse(await file.text()));info('恢复这份学习进度？',`<p>恢复后会替换当前设备上的学习记录和设置，并合并新增词。建议先保留一份当前备份。</p><div class="share-actions"><button class="secondary" id="beforeRestoreBackup">先备份当前进度</button><button class="primary" id="confirmRestore">确认恢复</button></div>`);$('beforeRestoreBackup').onclick=backup;$('confirmRestore').onclick=()=>{restored.batches=mergeBatches(state.batches,restored.batches);state=restored;persist();$('infoDialog').close();render();toast('学习进度已恢复。');};}catch(err){toast('没能恢复：'+err.message);}e.target.value='';};
  $('helpButton').onclick=()=>info('每天一点，怎么使用',`<h3>先听，再自己试一试</h3><p>点读：点喇叭听发音，看释义和例句。听英写中：先听英文，自写中文，再看答案。看中写英：先看中文，自写英文，再看答案。可以写在纸上，也可以写在页面里，页面不自动判分。</p><h3>复习怎么安排</h3><p>初学后1天再见；记住后依次隔2、4、7、15、30天再见。还不熟的词次日再见。重复练同一个词，当天不会重复推进复习阶段。预习未来词组不记入正式进度。</p><h3>每天都用这个合集</h3><p>在单词合集里添加新词和学习日期。今日任务自动选出开放的新词与到期旧词。老师可以生成一段学习通知，一次说清当天内容。</p><h3>进度在哪里</h3><p>存在当前设备、当前浏览器里。更换合集文件（包括下载后带新文件名的版本）、换手机、换浏览器或清除浏览记录前，先点“备份进度”；到“复习计划”里恢复。下载合集只包含词库，不携带学生的学习记录。</p><h3>有道词典发音</h3><p>单词点读和听写统一使用有道词典在线发音，新增词也使用同一来源。可以在学习设置中切换英式、美式和语速，需要保持联网。例句提供文字辅助理解。听不到时请检查网络和音量，再点一次。</p><p class="subtle">复习间隔是学习安排，并不保证每个人在相同天数内记牢。词义参考 <a href="https://dictionary.cambridge.org/" target="_blank" rel="noopener">Cambridge Dictionary</a>；间隔练习参考 <a href="https://www.edresearch.edu.au/guides-resources/practice-guides/spacing-and-retrieval-practice-guide-full-publication" target="_blank" rel="noopener">AERO学习指南</a>。</p>`);
  load();render();
  if(storageWarning)setTimeout(()=>toast('当前浏览器不能可靠保存记录，学习后请备份进度。'),500);
  let renderedDay=today();setInterval(()=>{if(today()!==renderedDay&&!$('practiceDialog').open){renderedDay=today();render();}},30000);
  window.addEventListener('storage',e=>{if(e.key===KEY&&!$('practiceDialog').open){load();render();}});
})();
</script>
</body></html>
