    $('main').innerHTML = `<div class="eyebrow">ONE COLLECTION, MANY LITTLE STEPS</div><h1 class="page-title">一本会长大的单词合集。</h1><p class="muted">已经收下 ${all.length} 个单词。今天的、明天的、以后的，都在这里。</p><div class="library-tools"><input class="search" id="searchWords" type="search" aria-label="搜索英文或中文" placeholder="找一个单词，或搜中文释义…" value="${esc(query)}"><button class="secondary" id="addWords">＋ 添加新词</button><button class="secondary" id="exportGarden">↓ 下载整个合集</button></div><div id="wordGroups">${groups.length ? groups.map(b => `<section class="batch"><div class="batch-head"><div><h2>${esc(b.title)} <span class="badge">${b.items.length} 词</span></h2><p>${esc(formattedDate(b.date))} ${b.date > today() ? '· 未到学习日，可提前看看' : '· 已开放学习'}</p></div><div class="batch-actions"><button data-batch="${esc(b.id)}" data-mode="read">点读</button><button data-batch="${esc(b.id)}" data-mode="en-zh">听英写中</button><button data-batch="${esc(b.id)}" data-mode="zh-en">看中写英</button></div></div><div class="word-grid">${b.items.map(w => `<div class="word-tile"><div class="word-info"><span class="word-en">${esc(w.en)}</span><span class="word-zh">${esc(w.zh)}</span></div>${state.progress[w.id]?.learnedOn ? '<span class="status-dot">学过</span>' : ''}<button class="speaker" data-speak="${esc(w.id)}" aria-label="朗读 ${esc(w.en)}">◖</button></div>`).join('')}</div></section>`).join('') : '<div class="empty">还没找到这个单词，换一个试试。</div>'}</div>`;
    $('searchWords').addEventListener('input', e => { const pos = e.target.selectionStart; query = e.target.value; renderLibrary(); $('searchWords').focus(); $('searchWords').setSelectionRange(pos,pos); });
    $('addWords').onclick = manager; $('exportGarden').onclick = downloadGarden;
    document.querySelectorAll('[data-speak]').forEach(el => el.onclick = () => speak(all.find(w => w.id === el.dataset.speak)));
    document.querySelectorAll('[data-batch]').forEach(el => el.onclick = () => startPractice(groups.find(b => b.id === el.dataset.batch).items, el.dataset.mode, groups.find(b => b.id === el.dataset.batch).title));
  }
  function renderGrowth() {
    const all = words(), learned = all.filter(w => state.progress[w.id]?.learnedOn);
    const future = learned.sort((a,b) => state.progress[a.id].nextReview.localeCompare(state.progress[b.id].nextReview));
    const days = Array.from({length:7}, (_,i) => C.addDays(today(),i));
    $('main').innerHTML = `<div class="eyebrow">COME BACK, AND REMEMBER</div><h1 class="page-title">老朋友，要常见面。</h1><p class="muted">新学之后，隔一段时间再见一面。还不熟的词，会更早回来。</p><section class="growth-intro"><h2>你的间隔复习节奏</h2><p class="muted">初学后次日复习；每次点“记住了”，再逐步拉长间隔。点“还不熟”，明天再见。</p><div class="intervals">${C.REVIEW_INTERVALS.map((n,i) => `${i?'<span>→</span>':''}<div class="interval">${n}<small>天后</small></div>`).join('')}</div><p class="week-caption">这是每次自测后到下一次复习的间隔，不是从首次学习日累计计算。每日数量上限之外的到期词会顺延，逾期词优先。</p></section><div class="section-title"><h2>未来七天 · 已安排的复习</h2><button id="growthSettings">每天新学${state.settings.newLimit} / 复习${state.settings.reviewLimit} · 修改 ↗</button></div><div class="calendar-row">${days.map((d,i) => `<div class="calendar-day ${i===0?'today':''}"><small>${i===0?'今天':formattedDate(d).split(' · ')[1]}</small><strong>${d.slice(8)}</strong><span>${learned.filter(w => i===0 ? state.progress[w.id].nextReview <= d && state.progress[w.id].lastStudied !== d : state.progress[w.id].nextReview === d).length} 词到期</span></div>`).join('')}</div><p class="subtle">这里只显示已有记录的下一次到期日。完成新的学习或复习后，后续安排会更新；实际每日练习还会按你的数量设置分配。</p>${future.length ? `<table class="schedule"><thead><tr><th>单词</th><th>下次复习</th><th>当前间隔</th><th>最近自测</th></tr></thead><tbody>${future.map(w => {const p=state.progress[w.id];return `<tr><td>${esc(w.en)}</td><td>${p.nextReview <= today() ? '今天 / 已到期' : esc(p.nextReview)}</td><td>${C.REVIEW_INTERVALS[p.stage]} 天</td><td>${p.history.at(-1)?.result === 'again' ? '还不熟' : '记住了'}</td></tr>`;}).join('')}</tbody></table>` : '<div class="empty">第一颗种子还没种下。<br>完成一个词的学习，这里就会出现复习安排。</div>'}<button class="secondary" id="restoreProgress">↑ 恢复之前的备份</button>`;
    $('growthSettings').onclick = settings; $('restoreProgress').onclick = () => $('restoreFile').click();
  }
  function render() { document.querySelectorAll('[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === view)); if (view==='today') renderToday(); else if(view==='library') renderLibrary(); else renderGrowth(); }
  function settings() { $('newLimit').value=state.settings.newLimit; $('reviewLimit').value=state.settings.reviewLimit; $('speechRate').value=state.settings.rate; $('speechAccent').value=state.settings.accent; openDialog('settingsDialog'); }
  function manager() { $('batchDate').value=today(); $('batchTitle').value=''; $('batchText').value=''; openDialog('managerDialog'); }
  function startPractice(list, mode, title) {
    if (!list.length) { toast(mode==='en-zh' ? '现在没有待练习的词，可以去单词合集选择一组。' : '这部分已经完成，去单词合集里再听听吧。'); return; }
    const preview = list.some(w => w.releaseDate > today());
    session = { words: [...list], mode, title, index: 0, revealed: mode==='read', known:0, again:0, preview, draft:'' };
    renderPractice(); openDialog('practiceDialog');
    // Sound always starts from a direct click, including the first listening prompt.
    if (mode==='en-zh') speak(session.words[0]);
  }
  function renderPractice() {
    const s=session, w=s.words[s.index];
    const listening=s.mode==='en-zh', reading=s.mode==='read';
    $('practiceContent').innerHTML = `<div class="practice-header"><h2 id="practiceTitle">${esc(s.title)} · ${reading?'单词点读':listening?'听英写中':'看中写英'}</h2><div class="session-count">${s.index+1} / ${s.words.length}</div><button class="icon-button" id="closePractice" aria-label="关闭练习">×</button></div><div class="progress-bar"><i style="width:${s.index/s.words.length*100}%"></i></div><div class="practice-prompt">${reading ? `<div class="eyebrow">LISTEN & LEARN</div><div class="word">${esc(w.en)}</div><div class="hint">${esc(w.ipa)}</div><button class="speaker" id="playWord" aria-label="朗读单词">◖</button>` : listening ? `<div class="eyebrow">LISTEN, THEN WRITE</div><button class="big-speaker" id="playWord" aria-label="重听英文单词">♫</button><div class="hint">听一听这个单词，在纸上或下方写出中文。<br>没听清楚，可以再点一次。</div>` : `<div class="eyebrow">THINK, THEN SPELL</div><div class="word zh-prompt">${esc(w.zh)}</div><div class="hint">想一想，在纸上或下方写出对应的英文单词。</div>`}</div>${!reading && !s.revealed ? '<textarea class="writing-area" id="selfAnswer" autocomplete="off" spellcheck="false" aria-label="自己的答案，仅供自测" placeholder="在这里写，或写在纸上都可以…"></textarea><button class="primary full" id="revealAnswer">写好了，查看答案</button>' : `<div class="answer-box"><div class="answer">${reading || listening ? esc(w.zh) : esc(w.en)}</div>${listening ? `<div class="subtle">${esc(w.en)} ${esc(w.ipa)}</div>` : ''}${w.example ? `<p>${esc(w.example)}<br>${esc(w.exampleZh)}</p><button class="text-link" id="playExample">◖ 听例句</button>` : ''}${!reading ? `<button class="text-link" id="answerAudio">◖ 听单词</button>`:''}</div><div class="practice-actions">${s.preview ? '<button class="primary" id="previewNext">下一个 →</button>' : '<button class="secondary" id="againNext">还不熟 · 下一个</button><button class="primary" id="knownNext">记住了 · 下一个 →</button>'}</div>`}<p class="selftest-note">${s.preview ? '提前看看：这组还没到学习日，本轮不写入学习进度。' : '自己判断就好，不自动判分。中途退出也会保存已完成的词。'}</p>`;
    $('closePractice').onclick=()=> $('practiceDialog').close();
    if ($('playWord')) $('playWord').onclick=()=>speak(w);
    if ($('revealAnswer')) $('revealAnswer').onclick=()=>{s.draft=$('selfAnswer').value;s.revealed=true;renderPractice();};
    if (!reading && s.revealed && s.draft) {
      const own=document.createElement('div'); own.className='answer-box own-answer';
      const label=document.createElement('div');label.className='subtle';label.textContent='你刚才写的答案';
      const text=document.createElement('div');text.style.whiteSpace='pre-wrap';text.textContent=s.draft;
      own.append(label,text);$('practiceContent').querySelector('.answer-box').before(own);
    }
    if ($('playExample')) $('playExample').onclick=()=>speak(w,true);
    if ($('answerAudio')) $('answerAudio').onclick=()=>speak(w);
    if ($('knownNext')) $('knownNext').onclick=()=>advance('known');
    if ($('againNext')) $('againNext').onclick=()=>advance('again');
    if ($('previewNext')) $('previewNext').onclick=()=>advance('preview');
  }
  function advance(result) {
    stopAudio(); const s=session,w=s.words[s.index];
    if (!s.preview) { state.progress=C.recordResult(state.progress,w.id,today(),result); persist(); }
    if(result==='known')s.known++; else if(result==='again')s.again++;
    s.index++;
    if(s.index>=s.words.length){ finishPractice();render();return; }
    s.revealed=s.mode==='read'; s.draft=''; renderPractice(); if(s.mode==='en-zh') speak(s.words[s.index]);
  }
  function finishPractice() {
    const s=session;
    $('practiceContent').innerHTML=`<div class="finish"><div class="flower">✳</div><h2 id="practiceTitle">${s.preview?'提前认识，明天再见。':'又积累了一点，真好。'}</h2><p>${s.preview ? '预习不会占用正式学习任务。' : `这一轮完成了 ${s.words.length} 个词。<br>还不熟的词已经安排到明天，慢慢来。`}</p>${s.preview?'':`<div class="finish-stats"><div><strong>${s.known}</strong><small>记住了</small></div><div><strong>${s.again}</strong><small>明天再见</small></div></div>`}<button class="primary full" id="finishClose">回到小花园</button>${s.mode==='read' ? '<button class="secondary full" style="margin-top:12px" id="tryDictation">再试试听英写中</button>' : ''}</div>`;
    $('finishClose').onclick=()=> $('practiceDialog').close();
    if($('tryDictation')) $('tryDictation').onclick=()=>startPractice(s.words,'en-zh',s.title);
  }
  function download(name, blob) { const a=document.createElement('a'); const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000); }
  function downloadGarden() {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('#main').innerHTML='';
    clone.querySelector('#practiceContent').innerHTML='';
    clone.querySelector('#infoBody').innerHTML='';
    clone.querySelector('#embeddedBatches').textContent = JSON.stringify(state.batches).replace(/</g,'\\u003c');
    clone.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));
    clone.querySelector('#toast').classList.remove('show');
    download('子昕的单词花园.html',new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}));
    toast('已下载完整合集，新增词也在里面。');
  }
  function backup() { download(`子昕学习进度-${today()}.json`,new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));toast('备份包含学习进度、设置和新增词。'); }
  function shareNotice() {
    const p=plan(), newList=[...p.completedNew,...p.newWords], reviewList=[...p.completedReview,...p.reviewWords];
    const text=`子昕，${formattedDate(today())}的单词任务来啦！\n\n新学（${newList.length}词）：${newList.map(w=>w.en).join(', ') || '今天没有新词'}\n复习（${reviewList.length}词）：${reviewList.map(w=>w.en).join(', ') || '按你自己的到期计划复习'}\n\n打开「单词花园」→ 今日学习。先点读，再做“听英写中”和“看中写英”，自己打开答案核对就好。\n每完成一个，选择“记住了”或“还不熟”。\n\n如果你调整了每日数量，以你自己的今日学习页面为准。`;
    const canLink=/^https?:$/.test(location.protocol) && !['localhost','127.0.0.1','::1'].includes(location.hostname);
    const link=canLink ? location.origin+location.pathname+'#task='+encodeURIComponent(JSON.stringify({date:today(),ids:[...newList,...reviewList].map(w=>w.id),batches:state.batches})) : '';
    info('今天学什么，一次说清楚',`<p>复制这段话发给孩子，后续每天都在同一本合集学习。</p><textarea class="notice-text" id="noticeText" rows="10" readonly>${esc(text+(link?'\n\n今日入口：'+link:''))}</textarea><div class="share-actions"><button class="primary" id="copyNotice">复制学习通知</button>${!link?'<button class="secondary" id="noticeDownload">下载合集给孩子</button>':''}</div><p class="subtle">${canLink?'老师的指定任务会在同一入口上方显示；学生的进度保存在自己的浏览器。':'当前是本地版本。更换合集文件前先备份进度，换文件后在“复习计划”恢复。固定在线入口需要另行发布。'}</p>`);
    $('copyNotice').onclick=async()=>{const field=$('noticeText');try{await navigator.clipboard.writeText(field.value);toast('学习通知已复制。');}catch{field.select();toast('请复制已选中的学习通知。');}};
    if($('noticeDownload'))$('noticeDownload').onclick=downloadGarden;
  }
  document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;render();});
  document.querySelector('.brand').onclick=e=>{e.preventDefault();view='today';render();};
  document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>$(el.dataset.close).close());
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
  $('practiceDialog').addEventListener('close',()=>{stopAudio();render();});
  $('settingsButton').onclick=settings;$('backupButton').onclick=backup;$('downloadGarden').onclick=downloadGarden;
  $('settingsForm').onsubmit=e=>{e.preventDefault();const newLimit=Number($('newLimit').value),reviewLimit=Number($('reviewLimit').value);if(!Number.isInteger(newLimit)||newLimit<1||newLimit>100||!Number.isInteger(reviewLimit)||reviewLimit<0||reviewLimit>200){toast('请填写有效的整数数量。');return;}state.settings={newLimit,reviewLimit,rate:Number($('speechRate').value),accent:$('speechAccent').value};persist();$('settingsDialog').close();render();toast('学习节奏已更新。');};
  $('batchForm').onsubmit=e=>{e.preventDefault();try{const date=$('batchDate').value;C.addDays(date,0);const lines=$('batchText').value.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)throw Error('先添几个词吧。');const data=lines.map(line=>{const parts=line.split(/[|｜\t]/);if(parts.length<2)throw Error('每行请按“英文 | 中文”填写。');return{en:parts[0].trim(),zh:parts.slice(1).join('；').trim()};});const batch=cleanBatches([{id:`custom-${Date.now()}`,date,title:$('batchTitle').value.trim(),words:data}])[0];const seen=new Set(words().map(w=>w.en));batch.words=batch.words.filter(w=>{if(seen.has(w.en))return false;seen.add(w.en);return true;});if(!batch.words.length)throw Error('这些词已经在合集里啦，无需重复添加。');state.batches.push(batch);persist();$('managerDialog').close();view='library';render();toast(`加入了${batch.words.length}个新词，以后都在这个合集。`);}catch(err){toast(err.message);}};
  $('restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>15*1024*1024)throw Error('备份文件过大');const restored=validateState(JSON.parse(await file.text()));info('恢复这份学习进度？',`<p>恢复后会替换当前设备上的学习记录和设置，并合并新增词。建议先保留一份当前备份。</p><div class="share-actions"><button class="secondary" id="beforeRestoreBackup">先备份当前进度</button><button class="primary" id="confirmRestore">确认恢复</button></div>`);$('beforeRestoreBackup').onclick=backup;$('confirmRestore').onclick=()=>{restored.batches=mergeBatches(state.batches,restored.batches);state=restored;persist();$('infoDialog').close();render();toast('学习进度已恢复。');};}catch(err){toast('没能恢复：'+err.message);}e.target.value='';};
  $('helpButton').onclick=()=>info('每天一点，怎么使用',`<h3>先听，再自己试一试</h3><p>点读：点喇叭听发音，看释义和例句。听英写中：先听英文，自写中文，再看答案。看中写英：先看中文，自写英文，再看答案。可以写在纸上，也可以写在页面里，页面不自动判分。</p><h3>复习怎么安排</h3><p>初学后1天再见；记住后依次隔2、4、7、15、30天再见。还不熟的词次日再见。重复练同一个词，当天不会重复推进复习阶段。预习未来词组不记入正式进度。</p><h3>每天都用这个合集</h3><p>在单词合集里添加新词和学习日期。今日任务自动选出开放的新词与到期旧词。老师可以生成一段学习通知，一次说清当天内容。</p><h3>进度在哪里</h3><p>存在当前设备、当前浏览器里。更换合集文件（包括下载后带新文件名的版本）、换手机、换浏览器或清除浏览记录前，先点“备份进度”；到“复习计划”里恢复。下载合集只包含词库，不携带学生的学习记录。</p><h3>发音</h3><p>最初38词已内置美式、英式音频。例句与后续添加的新词使用设备的英语朗读功能；部分手机需要安装英语语音，或联网。听不到时请检查音量，用Safari、Chrome或Edge打开。</p><p class="subtle">复习间隔是学习安排，并不保证每个人在相同天数内记牢。词义参考 <a href="https://dictionary.cambridge.org/" target="_blank" rel="noopener">Cambridge Dictionary</a>；间隔练习参考 <a href="https://www.edresearch.edu.au/guides-resources/practice-guides/spacing-and-retrieval-practice-guide-full-publication" target="_blank" rel="noopener">AERO学习指南</a>。</p>`);
  load();render();
  if(storageWarning)setTimeout(()=>toast('当前浏览器不能可靠保存记录，学习后请备份进度。'),500);
  let renderedDay=today();setInterval(()=>{if(today()!==renderedDay&&!$('practiceDialog').open){renderedDay=today();render();}},30000);
  window.addEventListener('storage',e=>{if(e.key===KEY&&!$('practiceDialog').open){load();render();}});
})();
</script>
</body></html>
